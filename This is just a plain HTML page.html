<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{--bg:#000000;--card:#16181f;--card2:#101218;--line:#2a2f3a;--txt:#e8ecf1;--sub:#8a93a5;
 --accent:#7fb2ff;--inputbg:#0d0f14;--btn:#1976d2;
 font-family:"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;
 display:flex;flex-direction:column;max-width:520px;margin:0 auto}
body.white{--bg:#ffffff;--card:#f2f4f8;--card2:#e8ecf2;--line:#d4dae2;--txt:#1a1d26;--sub:#6a7382;
 --accent:#1976d2;--inputbg:#ffffff;--btn:#1976d2}
.appbar{background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:12px;
 border-bottom:1px solid var(--line);flex-shrink:0}
.appbar .logo{width:30px;height:30px;border-radius:8px}
.appbar h1{font-size:19px;font-weight:600;flex:1}
.iconbtn{background:none;border:none;color:var(--txt);font-size:13px;cursor:pointer;
 width:38px;height:38px;border-radius:50%}
.iconbtn:active{background:var(--card2)}
.main{flex:1;overflow-y:auto;padding:14px}
.hint{background:var(--card2);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--sub);
 line-height:1.7;margin-bottom:6px}
.hint b{color:var(--accent)}
.proj{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;
 display:flex;align-items:center;gap:14px;cursor:pointer}
.proj:active{background:var(--card2)}
.proj .picon{width:46px;height:46px;border-radius:12px;background:var(--inputbg);display:flex;
 align-items:center;justify-content:center;font-size:12px;color:var(--accent);font-weight:bold;flex-shrink:0}
.proj .info{flex:1;min-width:0}
.proj .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .tm{font-size:12px;color:var(--sub);margin-top:3px}
.proj .arrow{color:var(--sub);font-size:18px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:50px 0}
.fab{position:fixed;right:22px;bottom:28px;width:56px;height:56px;border-radius:50%;
 background:var(--btn);color:#fff;border:none;font-size:24px;cursor:pointer;
 box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:10}
.fab:active{opacity:.85}
.filebar{display:flex;gap:8px;overflow-x:auto;padding:10px 0;flex-shrink:0}
.chip{background:var(--card);border-radius:20px;padding:7px 15px;font-size:13px;white-space:nowrap;
 cursor:pointer;border:1px solid var(--line)}
.chip.add{color:var(--accent)}
.chip:active{background:var(--card2)}
.fileitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;
 padding:11px 14px;margin-bottom:8px}
.fileitem .ficon{font-size:12px;color:var(--accent);font-weight:bold;min-width:38px}
.fileitem .fname{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileitem .fsize{font-size:11px;color:var(--sub)}
.fileitem .fdel{color:#e57373;background:none;border:none;font-size:12px;padding:4px 8px}
.fileitem .fedit{color:var(--accent);background:none;border:none;font-size:12px;padding:4px 8px}
.setcard{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:4px}
.setcard h3{font-size:13px;color:var(--accent);margin-bottom:10px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
 background:var(--inputbg);color:var(--txt);font-size:14px}
.row{display:flex;gap:8px}.row>div{flex:1}
.bigbtn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;
 font-weight:bold;cursor:pointer;margin-top:12px;color:#fff;background:var(--btn)}
.bigbtn:active{opacity:.85}
.bigbtn:disabled{opacity:.4}
.plain{background:var(--card2);color:var(--txt);font-weight:normal;font-size:13px;padding:10px}
.danger{background:#3a2430;color:#e57373;font-weight:normal;font-size:13px;padding:10px}
body.white .danger{background:#fdecec}
#log{background:var(--inputbg);border-radius:10px;padding:11px;font-size:11px;font-family:Consolas,monospace;
 max-height:160px;overflow-y:auto;color:#9ecb9e;margin-top:10px;display:none;white-space:pre-wrap;
 line-height:1.6;word-break:break-all}
#init{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
 justify-content:center;align-items:center;z-index:99;padding:28px;text-align:center}
#init .logo{width:72px;height:72px;border-radius:16px}
#pbarWrap{width:100%;max-width:300px;height:8px;background:var(--card2);border-radius:5px;
 margin-top:18px;overflow:hidden;display:none}
#pbar{height:100%;width:0%;background:var(--btn);border-radius:5px;transition:width .3s}
#pct{font-size:11px;color:var(--sub);margin-top:6px;white-space:pre-wrap}
.page{display:none;flex-direction:column;flex:1;min-height:0}
/* 应用内弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;
 justify-content:center;align-items:center;padding:24px}
.dlg{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px;
 max-height:80vh;overflow-y:auto}
.dlg h3{font-size:16px;margin-bottom:14px}
.dlg .opt{background:var(--inputbg);border-radius:10px;padding:12px 14px;margin-bottom:8px;
 font-size:14px;cursor:pointer;border:1px solid var(--line)}
.dlg .opt:active{background:var(--card2)}
.dlg .opt b{color:var(--accent)}
.dlg .opt small{display:block;color:var(--sub);font-size:11px;margin-top:3px}
.dlg .opt.warn{border-color:#5a3a3a}.dlg .opt.warn b{color:#e57373}
.dlg .opt.sel{border-color:var(--btn)}
/* 设置开关行 */
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
 border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .st{font-size:14px}
.setrow .sd{font-size:11px;color:var(--sub);margin-top:2px}
.setrow .cur{font-size:13px;color:var(--accent)}
.tgl{width:46px;height:26px;border-radius:13px;background:var(--card2);position:relative;
 cursor:pointer;border:1px solid var(--line);flex-shrink:0}
.tgl.on{background:var(--btn);border-color:var(--btn)}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
 background:#fff;transition:left .2s}
.tgl.on::after{left:22px}
/* 编辑器 */
#editorPage{background:var(--inputbg)}
.edbar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);
 background:var(--bg);flex-shrink:0}
.edbar .fname{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 color:var(--sub)}
.edbar .save{background:var(--btn);color:#fff;border:none;border-radius:8px;padding:7px 16px;
 font-size:13px;font-weight:bold;cursor:pointer}
#edWrap{flex:1;min-height:0}
#edWrap .CodeMirror{height:100%;font-family:Consolas,"Courier New",monospace}
body:not(.white) #edWrap .CodeMirror{background:var(--inputbg);color:#e8ecf1}
#plainEd{width:100%;height:100%;border:none;background:var(--inputbg);color:var(--txt);
 font-family:Consolas,monospace;font-size:13px;padding:10px;resize:none;outline:none}
</style>
</head>
<body>

<!-- 应用内弹窗 -->
<div class="mask" id="dlgMask">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <div id="dlgOpts"></div>
  </div>
</div>

<!-- 启动页 -->
<div id="init">
  <img class="logo" src="logo.png" onerror="this.style.display='none'">
  <div style="font-size:17px;margin-top:14px" id="initMsg">凤夏打包器</div>
  <div style="color:var(--sub);font-size:12px;margin-top:8px" id="initSub">正在启动…</div>
  <div id="pbarWrap"><div id="pbar"></div></div>
  <div id="pct"></div>
  <button class="bigbtn" id="initBtn" style="display:none;max-width:260px"></button>
  <button class="bigbtn plain" id="initBtn2" style="display:none;max-width:260px"></button>
</div>

<!-- 首页 -->
<div class="page" id="home">
  <div class="appbar">
    <img class="logo" src="logo.png" onerror="this.style.display='none'">
    <h1 id="homeTitle">凤夏打包器</h1>
    <button class="iconbtn" onclick="openSettings()" id="btnSet1">设置</button>
  </div>
  <div class="main">
    <div class="hint" id="homeHint"></div>
    <div id="rtInfo" class="hint" style="cursor:pointer" onclick="manageRuntime()"></div>
    <div id="projList"></div>
  </div>
  <button class="fab" onclick="newProject()">+</button>
</div>

<!-- 项目详情 -->
<div class="page" id="proj">
  <div class="appbar">
    <button class="iconbtn" onclick="goHome()">←</button>
    <h1 id="pTitle" style="font-size:17px"></h1>
    <button class="iconbtn" onclick="openSettings()" id="btnSet2">设置</button>
  </div>
  <div class="filebar">
    <div class="chip add" onclick="addFile()" id="chipAdd"></div>
    <div class="chip" onclick="refreshFiles()" id="chipRefresh"></div>
    <div class="chip" onclick="openExeHint()" id="chipHint"></div>
  </div>
  <div class="main">
    <div id="files"></div>
    <div class="setcard">
      <h3 id="secAppSet"></h3>
      <label id="lblAppName"></label><input id="appName">
      <div class="row">
        <div><label id="lblWinW"></label><input id="winW" value="1280"></div>
        <div><label id="lblWinH"></label><input id="winH" value="800"></div>
      </div>
      <button class="bigbtn plain" onclick="pickIcon()" id="btnIcon"></button>
      <div id="iconName" style="font-size:11px;color:var(--sub);margin-top:6px"></div>
      <button class="bigbtn" onclick="doPack()" id="btnPack"></button>
      <div id="packNote" style="font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6"></div>
      <button class="bigbtn danger" onclick="delProject()" id="btnDel"></button>
      <div id="log"></div>
    </div>
  </div>
</div>

<!-- 代码编辑器 -->
<div class="page" id="editorPage">
  <div class="edbar">
    <button class="iconbtn" onclick="closeEditor()">←</button>
    <div class="fname" id="edName"></div>
    <button class="save" onclick="saveEditor()" id="btnSave"></button>
  </div>
  <div id="edWrap"></div>
</div>

<!-- 设置页 -->
<div class="page" id="setPage">
  <div class="appbar">
    <button class="iconbtn" onclick="closeSettings()">←</button>
    <h1 style="font-size:17px" id="setTitle"></h1>
  </div>
  <div class="main">
    <div class="setcard">
      <h3 id="secLang"></h3>
      <div class="setrow" onclick="pickLanguage()" style="cursor:pointer">
        <div><div class="st" id="stLang"></div><div class="sd" id="stLangD"></div></div>
        <div class="cur" id="langCur"></div>
      </div>
    </div>
    <div class="setcard" style="margin-top:10px">
      <h3 id="secAppear"></h3>
      <div class="setrow">
        <div><div class="st" id="stTheme"></div><div class="sd" id="stThemeD"></div></div>
        <div class="tgl" id="tglTheme" onclick="toggleTheme()"></div>
      </div>
    </div>
    <div class="setcard" style="margin-top:10px">
      <h3 id="secEditor"></h3>
      <div class="setrow">
        <div><div class="st" id="stWrap"></div><div class="sd" id="stWrapD"></div></div>
        <div class="tgl" id="tglWrap" onclick="toggleSet('wrap',this)"></div>
      </div>
      <div class="setrow">
        <div><div class="st" id="stHint"></div><div class="sd" id="stHintD"></div></div>
        <div class="tgl" id="tglHint" onclick="toggleSet('hint',this)"></div>
      </div>
      <label id="lblFont"></label>
      <input id="setFont" type="number" value="14" onchange="saveFontSize(this.value)">
    </div>
    <div class="setcard" style="margin-top:10px">
      <h3 id="secMaint"></h3>
      <button class="bigbtn plain" onclick="doCleanup()" id="btnClean"></button>
      <div style="font-size:11px;color:var(--sub);margin-top:8px" id="cleanNote"></div>
      <div style="font-size:11px;color:var(--sub);margin-top:12px;line-height:1.7" id="verNote"></div>
    </div>
  </div>
</div>

  el.textContent=T("errBoot")+line+": "+msg;
 return false;
};

/* 语言辅助：T(key) 取当前语言文本；fmt 做占位替换 */
let CUR="zh";
function T(key){
 const d=I18N[CUR]||I18N.zh;
 return d[key]!==undefined?d[key]:(I18N.zh[key]||"");
}
function fmt(s,map){
 return String(s).replace(/\{(\w+)\}/g,function(_,k){return map[k]!==undefined?map[k]:"{"+k+"}";});
}

 nw10:{ name:"Windows 10/11", ver:"0.117.0", short:"Win10/11",

/* ===== 设置（localStorage 持久化）===== */
const SET={theme:"dark",wrap:false,hint:true,font:14,lang:"zh"};
function loadSet(){
 try{
  const s=JSON.parse(localStorage.getItem("fxset")||"{}");
  Object.assign(SET,s);
 }catch(_){}
 CUR=LANGS[SET.lang]?SET.lang:"zh";
 applyTheme();
}
function saveSet(){try{localStorage.setItem("fxset",JSON.stringify(SET));}catch(_){}}
function applyTheme(){
 document.body.classList.toggle("white",SET.theme==="white");
 const t=$("tglTheme");if(t)t.classList.toggle("on",SET.theme==="white");
}
function toggleTheme(){
 SET.theme=SET.theme==="white"?"dark":"white";
 saveSet();applyTheme();
 toast(SET.theme==="white"?T("tWhite"):T("tDark"));
}

/* ===== 工具函数 ===== */
function log(m,e){const b=$("log");b.style.display="block";
 b.textContent+=(b.textContent?"\n":"")+(e?T("logErr"):T("logOK"))+m;b.scrollTop=b.scrollHeight;}
function toast(m){try{webcat.ui.toast(m)}catch(_){}}
function fmtSize(s){return s>1048576?(s/1048576).toFixed(1)+"M":s>1024?(s/1024).toFixed(1)+"K":s+"B"}
function errText(e){
 if(!e)return T("errUnknown");
 if(typeof e==="string")return e;
 if(e.message)return e.message;
 try{return JSON.stringify(e)}catch(_){return String(e)}
}
function dlg(title,opts,cb){
 $("dlgTitle").textContent=title;
 const box=$("dlgOpts");box.innerHTML="";
 opts.forEach(function(o){
  const el=document.createElement("div");
  el.className="opt"+(o.cls?" "+o.cls:"");
  el.innerHTML="<b>"+o.t+"</b>"+(o.d?"<small>"+o.d+"</small>":"");
  el.onclick=function(){$("dlgMask").style.display="none";cb(o.val);};
  box.appendChild(el);
 });
 $("dlgMask").style.display="flex";
}
async function rmrf(path){
 try{
  const r=await webcat.ext.list("root",path);
  if(r&&r.items){
   for(const it of r.items){
    const p=path+"/"+it.name;
    if(it.isDir)await rmrf(p);
    else await webcat.ext.delete("root",p);
   }
  }
 }catch(_){}
 try{await webcat.ext.delete("root",path);}catch(_){}
}
function cleanupTemp(){
 rmrf(ROOT+"/_staging");
 rmrf(ROOT+"/_staging.zip");
 rmrf(ROOT+"/_inner_tmp");
 rmrf(ROOT+"/_unzip_tmp");
}

/* ===== 进度条 ===== */
let pTimer=null,pCur=0;
function paint(){$("pbar").style.width=pCur+"%";$("pct").textContent=Math.round(pCur)+"%";}
function pStart(){
 pCur=2;$("pbarWrap").style.display="block";paint();
 if(pTimer)clearInterval(pTimer);
 pTimer=setInterval(()=>{if(pCur<90){pCur+=0.5;paint();}},400);
}
function setP(p,label){
 if(pTimer)clearInterval(pTimer);
 pTimer=setInterval(()=>{if(pCur<p){pCur=Math.min(pCur+1.2,p);paint();}},80);
 if(label)$("initSub").textContent=label;
}
function pEnd(ok){
 if(pTimer)clearInterval(pTimer);pTimer=null;
 if(ok){pCur=100;paint();setTimeout(pHide,600);}else pHide();
}
function pReal(pc,txt){
 $("pbarWrap").style.display="block";
 $("pbar").style.width=pc+"%";$("pct").textContent=txt;
}
function pHide(){$("pbarWrap").style.display="none";$("pct").textContent="";}

/* ===== 启动 ===== */
async function waitWebcat(){
 for(let i=0;i<30;i++){
  $("initSub").textContent=T("conn")+" ("+Math.round(i/2)+"s)";
  if(window.webcat)return true;
  await new Promise(r=>setTimeout(r,500));
 }
 return false;
}
async function init(){
 loadSet();
 applyLang();
 try{
  if(!await waitWebcat()){
   $("initMsg").textContent=T("noBridge");
   $("initSub").textContent=T("bridgeFail");
   return;
  }
  if(!webcat.ext||!webcat.ext.isFullAccess){
   $("initMsg").textContent=T("noExt");
   $("initSub").textContent=T("preview");
   return;
  }
  if(!webcat.ext.isFullAccess().granted){
   $("initMsg").textContent=T("needPerm");
   $("initBtn").textContent=T("goPerm");
   $("initBtn").style.display="block";
   $("initBtn").onclick=function(){
    webcat.ext.requestFullAccess();
    setTimeout(()=>location.reload(),1500);
   };
   return;
  }
  $("initSub").textContent=T("initing");
  await webcat.ext.mkdir("root",ROOT);
  cleanupTemp();
  const has7=webcat.ext.exists("root",RUNTIMES.nw7.zip).exists;
  const has10=webcat.ext.exists("root",RUNTIMES.nw10.zip).exists;
  if(has7||has10){ startApp(); return; }
  $("initMsg").textContent=T("firstUse");
  $("initSub").textContent=T("firstUseD");
  $("initBtn").textContent=T("enter");
  $("initBtn").style.display="block";
  $("initBtn").onclick=startApp;
  $("initBtn2").textContent=T("dl7");
  $("initBtn2").style.display="block";
  $("initBtn2").onclick=function(){ downloadTemplate("nw7",startApp); };
 }catch(e){
  $("initMsg").textContent=T("createFail");
  $("initSub").textContent=errText(e);
 }
}
function startApp(){
 $("init").style.display="none";
 $("initBtn").style.display="none";
 $("initBtn2").style.display="none";
 pHide();
 $("home").style.display="flex";
 ready=true;
 renderHome();renderRTInfo();
}
if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded",init);
}else{ init(); }

/* ===== 下载模板 ===== */
let downloading=false;
function downloadTemplate(key,cb){
 if(downloading){toast(T("dlTitle")+"…");return;}
 downloading=true;
 const rt=RUNTIMES[key];
 $("initMsg").textContent=T("dlTitle")+" "+rt.name;
 $("initSub").textContent="v"+rt.ver+" · "+T("dlSize");
 $("initBtn").style.display="none";
 $("initBtn2").style.display="none";
 $("init").style.display="flex";
 webcat.download.stream({
  url:rt.url, source:"root", path:rt.zip,
  onProgress:function(p){
   if(p&&p.total){
    const pc=Math.round(p.loaded/p.total*100);
    pReal(pc,fmt(T("dlWin"),{p:pc})+"\n"+fmtSize(p.loaded)+" / "+fmtSize(p.total));
   }
  }
 }).then(function(r){
  downloading=false;
  if(!r||!r.ok)throw errText(r&&r.error)||T("dlFail");
  pReal(100,T("done"));
  toast(T("dlOK"));
  setTimeout(function(){ if(cb)cb(); else startApp(); },600);
 }).catch(function(e){
  downloading=false;
  pHide();
  $("initMsg").textContent=T("dlFail");
  $("initSub").textContent=errText(e);
  $("initBtn").textContent=T("retry");
  $("initBtn").style.display="block";
  $("initBtn").onclick=function(){ downloadTemplate(key,cb); };
  $("initBtn2").textContent=T("enterFirst");
  $("initBtn2").style.display="block";
  $("initBtn2").onclick=startApp;
 });
}

/* ===== 首页 ===== */
async function renderHome(){
 if(!ready)return;
 const r=await webcat.ext.list("root",ROOT);
 const list=(r.items||[]).filter(x=>x.isDir&&!x.name.startsWith("_")&&!x.name.startsWith("."))
   .sort((a,b)=>(b.modified||0)-(a.modified||0));
 const box=$("projList");
 if(!list.length){box.innerHTML="<div class='empty'>"+T("noProj")+"</div>";return;}
 box.innerHTML="";
 for(const p of list){
  let tag="";
  try{
   const f=await webcat.ext.readFile("root",ROOT+"/"+p.name+"/_runtime.txt","utf8");
   if(f&&f.ok&&RUNTIMES[String(f.content).trim()])tag=" · "+RUNTIMES[String(f.content).trim()].short;
  }catch(_){}
  const d=p.modified?new Date(p.modified*1000).toLocaleDateString():"";
  const el=document.createElement("div");el.className="proj";
  el.innerHTML='<div class="picon">DIR</div>'
   +'<div class="info"><div class="nm">'+p.name+'</div><div class="tm">'+d+tag+'</div></div>'
   +'<div class="arrow">›</div>';
  el.onclick=function(){openProj(p.name);};
  box.appendChild(el);
 }
}
function goHome(){
 cur=null;
 $("proj").style.display="none";$("home").style.display="flex";
 renderHome();renderRTInfo();
}

   +" · Win10/11 "+(h10?T("dl"):T("noDl"))+" "+T("manage");

function manageRuntime(){
 try{
  const h7=webcat.ext.exists("root",RUNTIMES.nw7.zip).exists;
  const h10=webcat.ext.exists("root",RUNTIMES.nw10.zip).exists;
  dlg(T("rtTpl"),[
   {t:"Win7 v0.41.3",d:h7?T("hasDl"):T("noDlD"),val:"1"},
   {t:"Win10/11 v0.117.0",d:h10?T("hasDl"):T("noDlD"),val:"2"},
   {t:T("cancel"),cls:"warn",val:"0"}
  ],function(v){
   if(v==="0")return;
   const key=v==="1"?"nw7":"nw10";
   const rt=RUNTIMES[key];
   const has=webcat.ext.exists("root",rt.zip).exists;
   if(!has){ downloadTemplate(key,startApp); return; }
   dlg(rt.name,[
    {t:T("redl"),val:"1"},
    {t:T("delTpl"),cls:"warn",val:"2"},
    {t:T("cancel"),val:"0"}
   ],function(a){
    if(a==="1")downloadTemplate(key,startApp);
    else if(a==="2"){
     toast(T("deleting"));
     webcat.ext.delete("root",rt.zip).then(function(){toast(T("deleted"));renderRTInfo();});
    }
   });
  });
 }catch(e){toast(errText(e));}
}

/* ===== 新建项目 ===== */
async function newProject(){
 if(!ready)return;
 const name=(prompt(T("projName"))||"").trim().replace(/[\\/:*?"<>|]/g,"");
 if(!name)return;
 const dir=ROOT+"/"+name;
 if(webcat.ext.exists("root",dir).exists){toast(T("sameName"));return;}
 dlg(T("pickSys"),[
  {t:"Windows 10/11",d:"NW.js v0.117.0 · "+T("rec"),val:"nw10"},
  {t:"Windows 7",d:"NW.js v0.41.3 · "+T("old"),val:"nw7"},
  {t:T("cancel"),cls:"warn",val:""}
 ],function(key){
  if(!key)return;
  createProject(name,dir,key);
 });
}
async function createProject(name,dir,key){
 const rt=RUNTIMES[key];
 if(!webcat.ext.exists("root",rt.zip).exists){
  dlg(T("needDl"),[
   {t:T("dlNow")+" "+rt.name,d:T("dlDesc"),val:"1"},
   {t:T("cancel"),cls:"warn",val:"0"}
  ],async function(a){
   if(a!=="1")return;
   await new Promise(function(res){ downloadTemplate(key,res); });
   if(webcat.ext.exists("root",rt.zip).exists)doCreate(name,dir,key);
  });
  return;
 }
 doCreate(name,dir,key);
}
async function doCreate(name,dir,key){
 const rt=RUNTIMES[key];
 $("initMsg").textContent=T("creating")+" ("+rt.short+")";
 $("initSub").textContent=T("unzip");
 $("initBtn").style.display="none";
 $("initBtn2").style.display="none";
 $("init").style.display="flex";
 pStart();
 try{
  setP(20,T("unzip"));
  await webcat.ext.mkdir("root",dir);
  const u=await webcat.ext.unzip("root",rt.zip,dir);
  if(!u||!u.ok)throw T("createFail");

  setP(90,T("rename"));
  const items=await webcat.ext.list("root",dir);
  if(items.items.length===1&&items.items[0].isDir&&items.items[0].name!==name){
   await webcat.ext.move("root",dir,ROOT+"/_unzip_tmp");
   await webcat.ext.move("root",ROOT+"/_unzip_tmp/"+items.items[0].name,dir);
   await rmrf(ROOT+"/_unzip_tmp");
  }
  if(!webcat.ext.exists("root",dir+"/nw.exe").exists)throw T("noExe");

  try{
   if(webcat.ext.exists("root",dir+"/index.html").exists)
    await webcat.ext.delete("root",dir+"/index.html");
  }catch(_){}

  await webcat.ext.writeFile("root",dir+"/_runtime.txt",key,"utf8");
  const langTag=CUR==="zh"?"zh-CN":CUR;
  const hello=CUR==="zh"?("你好，"+name+"！")
   :CUR==="ja"?("こんにちは、"+name+"！")
   :CUR==="ru"?("Привет, "+name+"!")
   :("Hello, "+name+"!");
  const tpl="<!DOCTYPE html>\n<html lang=\""+langTag+"\">\n<head>\n<meta charset=\"UTF-8\">\n"
   +"<title>"+name+"</title>\n<style>\nbody{margin:0;display:flex;justify-content:center;"
   +"align-items:center;height:100vh;font-family:sans-serif;color:#666}\n</style>\n</head>\n"
   +"<body>\n<h1>"+hello+"</h1>\n<script>\n// 在这里写你的代码\n<\/script>\n</body>\n</html>";
  await webcat.ext.writeFile("root",dir+"/index.html",tpl,"utf8");

  setP(96,T("done"));
  pEnd(true);
  $("init").style.display="none";
  toast(T("createOK")+" ("+rt.short+")");
  openProj(name);
 }catch(e){
  pEnd(false);
  await rmrf(dir);
  await rmrf(ROOT+"/_unzip_tmp");
  $("initMsg").textContent=T("createFail");
  $("initSub").textContent=errText(e);
  $("initBtn").textContent=T("back");
  $("initBtn").style.display="block";
  $("initBtn").onclick=startApp;
 }
}

/* ===== 项目详情 ===== */
const RUNTIME=/^(nw\.exe|nw\.nw|.*\.dll|.*\.pak|.*\.bin|.*\.dat|.*\.ico|package\.json|_runtime\.txt|icon\.png)$/i;
const RUNTIME_DIR=/^(locales|swiftshader)$/i;
const TEXT_EXT=/^(html|htm|css|js|json|txt|md|svg|xml|csv)$/i;

async function openProj(name){
 cur=name;$("pTitle").textContent=name;
 $("appName").value=name;
 $("log").textContent="";$("log").style.display="none";
 projRT="nw7";projIcon="";
 try{
  const f=await webcat.ext.readFile("root",ROOT+"/"+name+"/_runtime.txt","utf8");
  if(f&&f.ok&&RUNTIMES[String(f.content).trim()])projRT=String(f.content).trim();
 }catch(_){}
 updateIconLabel();
 $("home").style.display="none";$("proj").style.display="flex";
 refreshFiles();
}
function updateIconLabel(){
 $("iconName").textContent=projIcon?T("iconSet"):T("iconNone");
}
async function refreshFiles(){
 const r=await webcat.ext.list("root",ROOT+"/"+cur);
 const box=$("files");
 const files=(r.items||[]).filter(x=>!x.isDir&&!RUNTIME.test(x.name));
 const dirs=(r.items||[]).filter(x=>x.isDir&&!RUNTIME_DIR.test(x.name));
 const head='<div class="hint" style="margin-bottom:10px">'+T("target")+'： <b>'
  +RUNTIMES[projRT].name+' (v'+RUNTIMES[projRT].ver+')</b><br>'+T("editTip")+'</div>';
 if(!files.length&&!dirs.length){
  box.innerHTML=head+"<div class='empty'>"+T("noFiles")+"</div>";
  return;
 }
 box.innerHTML=head;
 files.forEach(function(f){
  const el=document.createElement("div");el.className="fileitem";
  const ext=f.name.split(".").pop().toLowerCase();
  const isText=TEXT_EXT.test(ext);
  el.innerHTML='<div class="ficon">'+(isText?ext.toUpperCase().slice(0,4):"BIN")+'</div>'
   +'<div class="fname">'+f.name+'</div>'
   +'<div class="fsize">'+fmtSize(f.size||0)+'</div>'
   +(isText?'<button class="fedit">'+T("edit")+'</button>':'')
   +'<button class="fdel">'+T("del")+'</button>';
  if(isText)el.querySelector(".fedit").onclick=function(){openEditor(f.name);};
  el.querySelector(".fname").onclick=function(){ if(isText)openEditor(f.name); };
  el.querySelector(".fdel").onclick=async function(){
   if(!confirm(fmt(T("delFile"),{n:f.name})))return;
   await webcat.ext.delete("root",ROOT+"/"+cur+"/"+f.name);
   refreshFiles();
  };
  box.appendChild(el);
 });
 dirs.forEach(function(d){
  const el=document.createElement("div");el.className="fileitem";
  el.innerHTML='<div class="ficon">DIR</div><div class="fname">'+d.name+'/</div><div class="fsize">'+T("dir")+'</div>';
  box.appendChild(el);
 });
}
async function addFile(){
 try{
  const r=await webcat.media.pickFile("*/*");
  if(!r||!r.ok)return;
  if(r.size>15*1024*1024){toast(T("tooBig"));return;}
  await webcat.ext.writeFile("root",ROOT+"/"+cur+"/"+r.name,r.base64,"base64");
  toast(T("added")+r.name);
  refreshFiles();
 }catch(e){toast(T("addFail")+errText(e))}
}
async function pickIcon(){
 try{
  const r=await webcat.media.pickFile("image/*");
  if(!r||!r.ok)return;
  await webcat.ext.writeFile("root",ROOT+"/"+cur+"/icon.png",r.base64,"base64");
  projIcon="icon.png";
  updateIconLabel();
  toast(T("iconOK"));
 }catch(e){toast(T("iconFail")+errText(e))}
}
async function delProject(){
 if(!confirm(fmt(T("delConfirm"),{n:cur})))return;
 toast(T("deleting"));
 await rmrf(ROOT+"/"+cur);
 toast(T("deleted"));
 goHome();
}
function openExeHint(){
 alert(T("exeHint"));
}

/* ===== 代码编辑器 ===== */
let cmInstance=null,edFile=null,plainEd=null;
function isDark(){return SET.theme!=="white";}
async function openEditor(fname){
 const path=ROOT+"/"+cur+"/"+fname;
 let content="";
 try{
  const r=await webcat.ext.readFile("root",path,"utf8");
  if(r&&r.ok)content=String(r.content);
  else if(r&&r.base64)content="";
 }catch(e){toast(T("readFail")+errText(e));return;}
 edFile=fname;
 $("edName").textContent=fname;
 $("proj").style.display="none";
 $("editorPage").style.display="flex";
 const wrap=$("edWrap");
 if(typeof CodeMirror!=="undefined"){
  wrap.innerHTML="";
  const mode=fname.endsWith(".html")||fname.endsWith(".htm")?"htmlmixed"
   :fname.endsWith(".css")?"css"
   :fname.endsWith(".js")||fname.endsWith(".json")?"javascript":"text/html";
  cmInstance=CodeMirror(wrap,{
   value:content, mode:mode, lineNumbers:true,
   lineWrapping:!!SET.wrap,
   autoCloseTags:true, matchBrackets:true,
   indentUnit:2, tabSize:2,
   extraKeys:{
    "Ctrl-Space":"autocomplete",
    "Ctrl-S":function(){saveEditor();}
   }
  });
  applyEdStyle();
  if(SET.hint){
   cmInstance.on("inputRead",function(cmir,ch){
    if(/\w|<|\./.test(ch.text[ch.text.length-1]||"")){
     CodeMirror.showHint(cmir,{completeSingle:false});
    }
   });
  }
 }else{
  wrap.innerHTML='<textarea id="plainEd" spellcheck="false"></textarea>';
  plainEd=$("plainEd");
  plainEd.value=content;
  plainEd.style.fontSize=SET.font+"px";
  plainEd.style.whiteSpace=SET.wrap?"pre-wrap":"pre";
 }
}
function applyEdStyle(){
 if(!cmInstance)return;
 cmInstance.setOption("lineWrapping",!!SET.wrap);
 const w=$("edWrap").querySelector(".CodeMirror");
 if(w){
  w.style.fontSize=SET.font+"px";
  w.style.background=isDark()?"#0d0f14":"#ffffff";
 }
}
async function saveEditor(){
 if(!edFile)return;
 const content=cmInstance?cmInstance.getValue():plainEd.value;
 try{
  await webcat.ext.writeFile("root",ROOT+"/"+cur+"/"+edFile,content,"utf8");
  toast(T("saved")+edFile);
 }catch(e){toast(T("saveFail")+errText(e))}
}
function closeEditor(){
 cmInstance=null;plainEd=null;edFile=null;
 $("editorPage").style.display="none";
 $("proj").style.display="flex";
 refreshFiles();
}

/* ===== 设置页 ===== */
function openSettings(){
 $("home").style.display="none";
 $("proj").style.display="none";
 $("setPage").style.display="flex";
 $("tglTheme").classList.toggle("on",SET.theme==="white");
 $("tglWrap").classList.toggle("on",!!SET.wrap);
 $("tglHint").classList.toggle("on",!!SET.hint);
 $("setFont").value=SET.font;
 $("langCur").textContent=(LANGS[CUR]||LANGS.zh).label;
}
function closeSettings(){
 $("setPage").style.display="none";
 if(cur){$("proj").style.display="flex";}
 else{$("home").style.display="flex";}
}
function toggleSet(key,el){
 SET[key]=!SET[key];
 el.classList.toggle("on",SET[key]);
 saveSet();
 if(key==="wrap")applyEdStyle();
}
function saveFontSize(v){
 const n=parseInt(v)||14;
 SET.font=n;saveSet();applyEdStyle();
 if(plainEd)plainEd.style.fontSize=n+"px";
}
function doCleanup(){
 toast(T("cleaning"));
 cleanupTemp();
 toast(T("cleanOK"));
}

/* ===== 打包 ===== */
async function doPack(){
 if(!cur)return;
 const app=($("appName").value||cur).replace(/[\\/:*?"<>|]/g,"");
 const dir=ROOT+"/"+cur;
 const rt=RUNTIMES[projRT];
 if(!webcat.ext.exists("root",dir+"/index.html").exists){
  toast(T("noIndex"));
  return;
 }
 if(!webcat.ext.exists("root",rt.zip).exists){
  toast(fmt(T("noTpl"),{n:rt.name}));
  return;
 }
 $("log").textContent="";$("log").style.display="block";
 log(fmt(T("startPack"),{n:app,r:rt.short,v:rt.ver}));
 try{
  /* 1. 生成 package.json（含图标/窗口配置） */
  const winCfg={width:+$("winW").value||1280,height:+$("winH").value||800};
  if(projIcon)winCfg.icon=projIcon;
  const pkg=JSON.stringify({name:cur,main:"index.html",window:winCfg},null,2);
  await webcat.ext.writeFile("root",dir+"/package.json",pkg);
  log(projIcon?T("genPkgIco"):T("genPkg"));

  /* 2. 素材 → 暂存目录 */
  await rmrf(ROOT+"/_staging");
  await webcat.ext.mkdir("root",ROOT+"/_staging");
  await webcat.ext.copy("root",dir+"/package.json",ROOT+"/_staging/package.json");
  if(projIcon)
   await webcat.ext.copy("root",dir+"/icon.png",ROOT+"/_staging/icon.png");
  const lst=await webcat.ext.list("root",dir);
  let n=0;
  for(const it of lst.items){
   if(it.isDir){
    if(RUNTIME_DIR.test(it.name))continue;
    await webcat.ext.copy("root",dir+"/"+it.name,ROOT+"/_staging/"+it.name);n++;
   }else if(!RUNTIME.test(it.name)){
    await webcat.ext.copy("root",dir+"/"+it.name,ROOT+"/_staging/"+it.name);n++;
   }
  }
  log(fmt(T("collect"),{n:n}));

  /* 3. 压成 .zip 改名 .nw */
  await rmrf(ROOT+"/_staging.zip");
  const z1=await webcat.ext.zip("root",ROOT+"/_staging",ROOT+"/_staging.zip");
  if(!z1||!z1.ok)throw T("zipFail")+errText(z1&&z1.error);
  await rmrf(ROOT+"/_staging");
  const nwPath=dir+"/"+app+".nw";
  if(webcat.ext.exists("root",nwPath).exists)
   await webcat.ext.delete("root",nwPath);
  await webcat.ext.move("root",ROOT+"/_staging.zip",nwPath);
  log(fmt(T("genNw"),{n:app}));

  /* 4. 整个项目 → 最终 ZIP */
  const zipPath=ROOT+"/"+app+"_"+rt.short+"_pack.zip";
  if(webcat.ext.exists("root",zipPath).exists)
   await webcat.ext.delete("root",zipPath);
  const z2=await webcat.ext.zip("root",dir,zipPath);
  if(!z2||!z2.ok)throw T("zipFail2")+errText(z2&&z2.error);
  log(fmt(T("packed"),{s:fmtSize(z2.size||0)}));

  const s=webcat.share.file("root",zipPath,"application/zip");
  if(s&&s.ok)log(T("packDone"));
  else log(fmt(T("packFind"),{p:zipPath}));
 }catch(e){
  log(errText(e),true);
  log(T("packFailTip"));
  toast(T("packFail"));
 }
}
